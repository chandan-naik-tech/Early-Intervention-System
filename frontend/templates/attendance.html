{% extends "base.html" %}{% block body %}<h2>Take attendance</h2>
<form class="card" method="get">Date <input type="date" name="date" value="{{ d }}"> <button>Load</button></form>
<form class="card overflow" method="post"><input type="hidden" name="date" value="{{ d }}"><table><tr><th>Student</th><th>Roll</th><th>Present</th><th>Absent</th></tr>
{% for s in rows %}<tr><td>{{ s.name }}</td><td>{{ s.roll }}</td><td><input type="radio" name="s{{ s.id }}" value="1" {{ 'checked' if cur.get(s.id, 1) == 1 }}></td><td><input type="radio" name="s{{ s.id }}" value="0" {{ 'checked' if cur.get(s.id, 1) == 0 }}></td></tr>{% endfor %}</table>
<button type="button" onclick="document.querySelectorAll('input[value=&quot;1&quot;]').forEach(r=>r.checked=true)">Mark all present</button> <button>Save attendance</button></form>{% endblock %}
